name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev webkit2gtk-driver xvfb xauth dbus-x11

      - name: Select macOS Python with current SQLite
        if: runner.os == 'macOS'
        run: |
          brew install python@3.13
          echo "UV_PYTHON=$(brew --prefix python@3.13)/bin/python3.13" >> "$GITHUB_ENV"

      - name: Core setup
        run: uv sync --directory core

      - name: Check loaded SQLite version
        working-directory: core
        run: |
          uv run python -c 'import sqlite3; print("SQLite", sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 51, 3), "SQLite 3.51.3 or newer is required"'

      - name: Core checks
        working-directory: core
        run: |
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright

      - name: UI setup
        run: pnpm --dir desktop install --frozen-lockfile

      - name: UI checks
        working-directory: desktop
        run: |
          pnpm test
          pnpm build
          pnpm run check:api

      - name: Rust format check
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build desktop shell
        working-directory: desktop/src-tauri
        run: cargo build

      - name: Launcher tests (real shell spawn-and-stop code)
        working-directory: desktop/src-tauri
        env:
          CORPI_CORE_DIR: ${{ github.workspace }}/core
        run: cargo test --test launcher -- --test-threads=1

      - name: Install native WebDriver (Linux)
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Native viewer E2E (Linux / WebKitGTK)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm --dir desktop run test:e2e

      - name: Native viewer E2E (macOS / WKWebView)
        if: runner.os == 'macOS'
        run: pnpm --dir desktop run test:e2e

      - name: Upload native viewer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-viewer-${{ matrix.os }}-${{ github.sha }}
          path: desktop/e2e-results/
          if-no-files-found: warn
          retention-days: 14
