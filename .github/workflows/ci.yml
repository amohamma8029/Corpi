name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # Fail on any shared command, including under Git Bash on Windows.
    shell: bash

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update
          # The WebKitGTK driver package was renamed in Ubuntu 26.04.
          webkit_driver_package=webkit2gtk-driver
          if apt-cache show webkitgtk-webdriver >/dev/null 2>&1; then
            webkit_driver_package=webkitgtk-webdriver
          fi
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y libwebkit2gtk-4.1-dev libgtk-3-dev "$webkit_driver_package" xvfb xauth dbus-x11

      - name: Select macOS Python with current SQLite
        if: runner.os == 'macOS'
        run: |
          brew install python@3.13
          echo "UV_PYTHON=$(brew --prefix python@3.13)/bin/python3.13" >> "$GITHUB_ENV"

      - name: Select Windows managed Python
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content core/.python-version -Raw).Trim()
          uv python install $version
          $python = uv python find --managed-python --no-project $version
          "UV_PYTHON=$python" >> $env:GITHUB_ENV

      - name: Core setup
        run: uv sync --directory core

      - name: Check loaded SQLite version
        working-directory: core
        run: |
          uv run python -c 'import sqlite3; print("SQLite", sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 51, 3), "SQLite 3.51.3 or newer is required"'

      - name: Core checks
        working-directory: core
        run: |
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright

      - name: UI setup
        run: pnpm --dir desktop install --frozen-lockfile

      - name: UI checks
        working-directory: desktop
        run: |
          pnpm run check:security
          pnpm test
          pnpm build
          pnpm run check:api

      - name: Rust format check
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri

      - name: Build desktop shell
        working-directory: desktop/src-tauri
        run: cargo build

      - name: Launcher tests (real shell spawn-and-stop code)
        working-directory: desktop/src-tauri
        env:
          CORPI_CORE_DIR: ${{ github.workspace }}/core
        run: cargo test --test launcher -- --test-threads=1

      - name: Install native WebDriver (Linux)
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Native viewer E2E (Linux / WebKitGTK)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" dbus-run-session -- pnpm --dir desktop run test:e2e

      - name: Native viewer E2E (macOS / WKWebView)
        if: runner.os == 'macOS'
        run: pnpm --dir desktop run test:e2e

      - name: Upload native viewer evidence
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-viewer-${{ matrix.os }}-${{ github.sha }}
          path: desktop/e2e-results/
          if-no-files-found: warn
          retention-days: 14
