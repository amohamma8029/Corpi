name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Select macOS Python with current SQLite
        if: runner.os == 'macOS'
        run: |
          brew install python@3.13
          echo "UV_PYTHON=$(brew --prefix python@3.13)/bin/python3.13" >> "$GITHUB_ENV"

      - name: Core setup
        run: uv sync --directory core

      - name: Check loaded SQLite version
        working-directory: core
        run: |
          uv run python -c 'import sqlite3; print("SQLite", sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 51, 3), "SQLite 3.51.3 or newer is required"'

      - name: Core checks
        working-directory: core
        run: |
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright

      - name: UI setup
        run: pnpm --dir desktop install --frozen-lockfile

      - name: UI checks
        working-directory: desktop
        run: |
          pnpm test
          pnpm build

      - name: Rust format check
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build desktop shell
        working-directory: desktop/src-tauri
        run: cargo build

      - name: Launcher tests (real shell spawn-and-stop code)
        working-directory: desktop/src-tauri
        env:
          CORPI_CORE_DIR: ${{ github.workspace }}/core
        run: cargo test --test launcher -- --test-threads=1
