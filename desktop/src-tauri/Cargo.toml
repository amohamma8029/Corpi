[package]
name = "corpi-desktop"
version = "0.1.0"
license = "MIT"
description = "Corpi desktop shell: launches and monitors the local core."
edition = "2021"

[lib]
name = "corpi_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Explicitly enabled by the native E2E runner, never by an ordinary app build.
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
win32job = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
